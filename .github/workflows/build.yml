name: Windows Build & Test

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.10.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia

      - name: Setup FFmpeg 6.1.1
        id: setup-ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: "6.1.1"
          linking: shared

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR" `
            "-DFFMPEG_ROOT=${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}"

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 2>&1 | Tee-Object build-debug.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object build-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Debug tests
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Run Release tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build-debug.log
            build-release.log
          if-no-files-found: ignore
