name: Windows Build & Test

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.10.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools

      - name: Install FFmpeg development build
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          7z x ffmpeg.7z -offmpeg-extract -y | Out-Null
          $root = Get-ChildItem ffmpeg-extract -Directory | Select-Object -First 1
          if (-not $root) { throw "FFmpeg archive root was not found" }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\ffmpeg" | Out-Null
          Copy-Item "$($root.FullName)\*" "$env:GITHUB_WORKSPACE\ffmpeg" -Recurse -Force
          "FFMPEG_ROOT=$env:GITHUB_WORKSPACE\ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "PATH=$env:GITHUB_WORKSPACE\ffmpeg\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify Visual Studio toolchain
        shell: pwsh
        run: |
          cmake --help | Select-String "Visual Studio"
          $vsRoot = Join-Path $env:ProgramFiles "Microsoft Visual Studio\2022"
          if (-not (Test-Path $vsRoot)) {
            throw "Visual Studio 2022 installation root was not found: $vsRoot"
          }
          Get-ChildItem $vsRoot -Directory | Select-Object -ExpandProperty FullName
      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR" `
            "-DFFMPEG_ROOT=$env:FFMPEG_ROOT"

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 2>&1 | Tee-Object build-debug.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object build-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage self-contained Windows package
        shell: pwsh
        run: |
          ./packaging/windows/package-windows.ps1 -BuildDir "$env:GITHUB_WORKSPACE\\build" -FFmpegRoot "$env:FFMPEG_ROOT"

          $stage = "$env:GITHUB_WORKSPACE\\build\\installer-stage"
          Get-ChildItem $stage -File | Select-Object -ExpandProperty Name

          $required = @(
            "WeaR-Studio.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Network.dll",
            "Qt6Multimedia.dll",
            "Qt6Quick.dll",
            "Qt6OpenGL.dll",
            "Qt6OpenGLWidgets.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $stage $file))) {
              throw "Required packaged runtime file is missing: $file"
            }
          }

          $ffmpegRuntime = Get-ChildItem -Path $stage -Filter "av*.dll" -File
          if (-not $ffmpegRuntime) {
            throw "No FFmpeg runtime DLLs were found in the package."
          }

          Write-Host "Package contains $($ffmpegRuntime.Count) FFmpeg DLL(s)."

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

          $candidates = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source,
            "$env:ProgramFiles\\Inno Setup 7\\ISCC.exe",
            "$env:ProgramFiles\\Inno Setup 6\\ISCC.exe",
            "${env:ProgramFiles(x86)}\\Inno Setup 7\\ISCC.exe",
            "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          ) | Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          }

          $iscc = $candidates | Select-Object -First 1

          if (-not $iscc) {
            $iscc = Get-ChildItem `
              -Path "$env:ProgramFiles", "${env:ProgramFiles(x86)}" `
              -Filter ISCC.exe `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          Write-Host "Using Inno Setup compiler: $iscc"
          "ISCC_EXE=$iscc" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Build Windows installer
        shell: pwsh
        run: |
          $outputDir = "$env:GITHUB_WORKSPACE\\build\\installer"
          New-Item -ItemType Directory -Force $outputDir | Out-Null

          & "$env:ISCC_EXE" "/dSourceDir=$env:GITHUB_WORKSPACE\\build\\installer-stage" "/dOutputDir=$outputDir" "$env:GITHUB_WORKSPACE\\packaging\\windows\\WeaR-Studio.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installer = Get-ChildItem $outputDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "Installer executable was not produced."
          }

          Write-Host "Installer created: $($installer.FullName)"

      - name: Clean-machine installer smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE\\build\\installer" -Filter "*.exe" -File | Select-Object -First 1

          $installDir = "$env:GITHUB_WORKSPACE\\clean-machine-install"
          if (Test-Path $installDir) {
            Remove-Item -Recurse -Force $installDir
          }

          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$installDir"

          if ($LASTEXITCODE -ne 0) {
            throw "Silent installer failed with exit code $LASTEXITCODE"
          }

          $installedExe = Join-Path $installDir "WeaR-Studio.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed executable was not found: $installedExe"
          }

          $env:PATH = "$env:SystemRoot\\System32;$env:SystemRoot"
          & $installedExe --smoke-test 2>&1 | Tee-Object installed-smoke-test.log

          if ($LASTEXITCODE -ne 0) {
            throw "Installed package smoke test failed with exit code $LASTEXITCODE"
          }

          Write-Host "Clean-machine installer smoke test passed."

      - name: Run Debug tests
        shell: pwsh
        env:
          WEAR_RHI_TEST_OUTPUT_DIR: ${{ github.workspace }}\\build\\rhi-test-output
          WEAR_REQUIRE_RHI_TEST: "0"
        run: |
          New-Item -ItemType Directory -Force "$env:WEAR_RHI_TEST_OUTPUT_DIR" | Out-Null
          ctest --test-dir build -C Debug --output-on-failure -LE benchmark

      - name: Run Release tests
        shell: pwsh
        env:
          WEAR_RHI_TEST_OUTPUT_DIR: ${{ github.workspace }}\\build\\rhi-test-output
          WEAR_REQUIRE_RHI_TEST: "0"
        run: |
          New-Item -ItemType Directory -Force "$env:WEAR_RHI_TEST_OUTPUT_DIR" | Out-Null
          ctest --test-dir build -C Release --output-on-failure -LE benchmark

      - name: Measure compositing CPU usage
        shell: pwsh
        env:
          WEAR_BENCHMARK_WIDTH: "1920"
          WEAR_BENCHMARK_HEIGHT: "1080"
          WEAR_BENCHMARK_LAYERS: "4"
          WEAR_BENCHMARK_FRAMES: "60"
        run: |
          ctest --test-dir build -C Release -V -R CompositingBenchmark 2>&1 | Tee-Object compositing-benchmark.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify recording outputs with ffprobe
        shell: pwsh
        env:
          WEAR_RECORDING_TEST_OUTPUT_DIR: ${{ github.workspace }}\\build\\recording-test-output
        run: |
          New-Item -ItemType Directory -Force "$env:WEAR_RECORDING_TEST_OUTPUT_DIR" | Out-Null
          ctest --test-dir build -C Release -R RecordingManagerTest --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($extension in @("mp4", "mkv", "flv")) {
            $file = Join-Path $env:WEAR_RECORDING_TEST_OUTPUT_DIR "recording-sample.$extension"
            if (-not (Test-Path $file)) {
              throw "Recording fixture was not created: $file"
            }

            & ffprobe -v error -show_entries format=format_name,duration `
              -show_entries stream=index,codec_type,codec_name `
              -of json "$file" | Out-File "$file.ffprobe.json" -Encoding utf8

            if ($LASTEXITCODE -ne 0) {
              throw "ffprobe rejected recording fixture: $file"
            }

            $videoCodec = & ffprobe -v error -select_streams v:0 `
              -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$file"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($videoCodec -join ""))) {
              throw "No readable video stream found by ffprobe: $file"
            }

            $audioCodec = & ffprobe -v error -select_streams a:0 `
              -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$file"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($audioCodec -join ""))) {
              throw "No readable audio stream found by ffprobe: $file"
            }

            Write-Host "ffprobe OK: $file | video=$($videoCodec -join '') audio=$($audioCodec -join '')"
          }

      - name: Upload Windows installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-studio-windows-installer
          path: |
            build/installer/*.exe
            installed-smoke-test.log
            build/installer-stage/package-manifest.json
          if-no-files-found: ignore

      - name: Upload RHI visual and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhi-compositing-verification
          path: |
            build/rhi-test-output/*
            compositing-benchmark.log
          if-no-files-found: ignore

      - name: Upload recording verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-verification
          path: |
            build/recording-test-output/*
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build-debug.log
            build-release.log
          if-no-files-found: ignore
