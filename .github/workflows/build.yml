name: Windows Build & Test

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.10.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools

      - name: Install FFmpeg development build
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          7z x ffmpeg.7z -offmpeg-extract -y | Out-Null
          $root = Get-ChildItem ffmpeg-extract -Directory | Select-Object -First 1
          if (-not $root) { throw "FFmpeg archive root was not found" }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\ffmpeg" | Out-Null
          Copy-Item "$($root.FullName)\*" "$env:GITHUB_WORKSPACE\ffmpeg" -Recurse -Force
          "FFMPEG_ROOT=$env:GITHUB_WORKSPACE\ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "PATH=$env:GITHUB_WORKSPACE\ffmpeg\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR" `
            "-DFFMPEG_ROOT=$env:FFMPEG_ROOT"

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 2>&1 | Tee-Object build-debug.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object build-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Debug tests
        shell: pwsh
        env:
          WEAR_RHI_TEST_OUTPUT_DIR: ${{ github.workspace }}\\build\\rhi-test-output
          WEAR_REQUIRE_RHI_TEST: "0"
        run: |
          New-Item -ItemType Directory -Force "$env:WEAR_RHI_TEST_OUTPUT_DIR" | Out-Null
          ctest --test-dir build -C Debug --output-on-failure -LE benchmark

      - name: Run Release tests
        shell: pwsh
        env:
          WEAR_RHI_TEST_OUTPUT_DIR: ${{ github.workspace }}\\build\\rhi-test-output
          WEAR_REQUIRE_RHI_TEST: "0"
        run: |
          New-Item -ItemType Directory -Force "$env:WEAR_RHI_TEST_OUTPUT_DIR" | Out-Null
          ctest --test-dir build -C Release --output-on-failure -LE benchmark

      - name: Measure compositing CPU usage
        shell: pwsh
        env:
          WEAR_BENCHMARK_WIDTH: "1920"
          WEAR_BENCHMARK_HEIGHT: "1080"
          WEAR_BENCHMARK_LAYERS: "4"
          WEAR_BENCHMARK_FRAMES: "60"
        run: |
          ctest --test-dir build -C Release -V -R CompositingBenchmark 2>&1 | Tee-Object compositing-benchmark.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify recording outputs with ffprobe
        shell: pwsh
        env:
          WEAR_RECORDING_TEST_OUTPUT_DIR: ${{ github.workspace }}\\build\\recording-test-output
        run: |
          New-Item -ItemType Directory -Force "$env:WEAR_RECORDING_TEST_OUTPUT_DIR" | Out-Null
          ctest --test-dir build -C Release -R RecordingManagerTest --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($extension in @("mp4", "mkv", "flv")) {
            $file = Join-Path $env:WEAR_RECORDING_TEST_OUTPUT_DIR "recording-sample.$extension"
            if (-not (Test-Path $file)) {
              throw "Recording fixture was not created: $file"
            }

            & ffprobe -v error -show_entries format=format_name,duration `
              -show_entries stream=index,codec_type,codec_name `
              -of json "$file" | Out-File "$file.ffprobe.json" -Encoding utf8

            if ($LASTEXITCODE -ne 0) {
              throw "ffprobe rejected recording fixture: $file"
            }

            $videoCodec = & ffprobe -v error -select_streams v:0 `
              -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$file"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($videoCodec -join ""))) {
              throw "No readable video stream found by ffprobe: $file"
            }

            $audioCodec = & ffprobe -v error -select_streams a:0 `
              -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$file"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($audioCodec -join ""))) {
              throw "No readable audio stream found by ffprobe: $file"
            }

            Write-Host "ffprobe OK: $file | video=$($videoCodec -join '') audio=$($audioCodec -join '')"
          }

      - name: Upload recording verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-verification
          path: |
            build/recording-test-output/*
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build-debug.log
            build-release.log
          if-no-files-found: ignore
